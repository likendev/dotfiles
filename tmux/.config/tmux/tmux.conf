source-file $XDG_CONFIG_HOME/tmux/tmux.keybinds.conf
# General config
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g automatic-rename on
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g mouse on

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'

# Override catppuccin module text with direct shell calls (bypasses tmux-battery/tmux-cpu
# interpolation which doesn't work with catppuccin v2's variable-based module system)
set -g @catppuccin_battery_icon "#(~/.config/tmux/plugins/tmux-battery/scripts/battery_icon.sh) "
set -g @catppuccin_battery_text " #(~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh)"
set -g @catppuccin_cpu_text " #(~/.config/tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)"
set -g @catppuccin_ram_text " #(~/.config/tmux/plugins/tmux-cpu/scripts/ram_percentage.sh)"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_battery}#{E:@catppuccin_status_cpu}#{E:@catppuccin_status_ram}"
set -g status-left-length 100
set -g status-right-length 100

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
